        code: "import requests\n\ndef main(action_items: list, trello_api_key: str,\
          \ trello_token: str, trello_list_id: str) -> dict:\n    api_key = trello_api_key\n\
          \    token = trello_token\n    list_id = trello_list_id\n\n    created_cards\
          \ = []\n    errors = []\n    for idx, item in enumerate(action_items):\n\
          \        try:\n            task = item.get('task')\n            if not task:\n\
          \                errors.append(f\"第{idx+1}项缺少task字段，跳过\")\n            \
          \    continue\n            if not isinstance(task, str):\n             \
          \   task = str(task)\n            assignee = item.get('assignee')\n    \
          \        due = item.get('due')\n            details = item.get('details')\n\
          \            if assignee is not None and not isinstance(assignee, str):\n\
          \                assignee = str(assignee)\n            if due is not None\
          \ and not isinstance(due, str):\n                due = str(due)\n      \
          \      if details is not None and not isinstance(details, str):\n      \
          \          details = str(details)\n\n            desc = f\"负责人：{assignee\
          \ if assignee else '未指定'}\\n截止时间：{due if due else '未指定'}\\n细节：{details if\
          \ details else ''}\"\n            url = \"https://api.trello.com/1/cards\"\
          \n            params = {\n                'key': api_key,\n            \
          \    'token': token,\n                'idList': list_id,\n             \
          \   'name': task,\n                'desc': desc,\n                'due':\
          \ due if due else None\n            }\n            response = requests.post(url,\
          \ params=params, timeout=10)\n            if response.status_code == 200:\n\
          \                created_cards.append(response.json())\n            else:\n\
          \                errors.append(f\"第{idx+1}项创建失败，状态码{response.status_code}：{response.text}\"\
          )\n        except Exception as e:\n            errors.append(f\"第{idx+1}项处理异常：{str(e)}\"\
          )\n\n    return {\"created_cards\": created_cards, \"errors\": errors}"
