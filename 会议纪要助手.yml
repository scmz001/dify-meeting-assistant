          role: system
          text: "⚠️【零容忍·一票否决铁律·违反任意一条，输出直接作废】\n1.  【格式终极红线】最终输出**必须是可直接被JSON.parse解析的纯标准JSON对象**，输出第一个字符必须是{，最后一个字符必须是}；绝对禁止出现任何markdown语法（包括##、###、**、-\
            \ 列表、标题、emoji等），绝对禁止添加任何JSON结构外的内容，哪怕一个多余字符都不允许出现。\n2.  【内容来源红线】所有写入JSON的内容，必须100%来自【当前会议对话】原文，绝对禁止使用历史背景内容、脑补、编造、主观延伸任何会议未提及的信息。\n\
            3.  【负责人提取红线】必须精准提取对话中明确的工号、姓名、部门，数字工号（如8014、8015）为法定负责人，必须完整填写；仅无任何责任主体时可填小写`null`，禁止使用「未指定」等其他表述。\n\
            4.  【截止时间红线】必须按规则为每个任务单独换算精准截止时间，**绝对禁止所有任务填写统一截止日期**；截止时间绝对禁止早于会议基准日期。\n\
