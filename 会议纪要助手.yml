    - data:
        code: "import json\n\ndef main(file_content, **kwargs):\n    # 将输入统一转为字符串（如果是列表则拼接）\n\
          \    if isinstance(file_content, list):\n        text = ''.join(file_content)\n\
          \    else:\n        text = file_content\n\n    # 去除可能的 BOM\n    text = text.lstrip('\\\
          ufeff')\n\n    decoder = json.JSONDecoder()\n    pos = 0\n    dialogue_lines\
          \ = []\n    meeting_id = None\n    errors = []\n\n    while pos < len(text):\n\
          \        try:\n            obj, end = decoder.raw_decode(text, pos)\n  \
          \          if 'metadata' in obj:\n                meeting_id = obj['metadata'].get('meeting_id',\
          \ 'unknown')\n            elif 'transcript_text' in obj:\n             \
          \   speaker = obj.get('speaker_id', 'unknown')\n                content\
          \ = obj['transcript_text']\n                dialogue_lines.append(f\"{speaker}:\
          \ {content}\")\n            pos = end\n            # 跳过空白字符（包括换行、空格等）\n\
          \            while pos < len(text) and text[pos].isspace():\n          \
          \      pos += 1\n        except json.JSONDecodeError as e:\n           \
          \ errors.append(f\"位置{pos}: {text[pos:pos+100]}... 错误: {e}\")\n        \
          \    break  # 遇到解析错误停止\n\n    # 可选：打印错误供调试（在 Dify 代码节点日志中可见）\n    if errors:\n\
          \        print(\"解析错误:\", errors[:3])\n\n    return {\n        \"meeting_id\"\
          : meeting_id,\n        \"dialogue\": \"\\n\".join(dialogue_lines)\n    }"
        code_language: python3
        desc: ''
