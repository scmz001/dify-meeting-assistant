    - data:
        code: "def main(**kwargs) -> dict:\n    # 获取基础信息\n    meeting_id = kwargs.get('meeting_id',\
          \ '未知')\n    discussions_raw = kwargs.get('discussions') or []\n    decisions_raw\
          \ = kwargs.get('decisions') or []\n    action_items_raw = kwargs.get('action_items')\
          \ or []\n\n    # 通用提取函数：将任意列表转换为字符串列表（用于 discussions）\n    def extract_text_list(items):\n\
          \        result = []\n        for item in items:\n            if isinstance(item,\
          \ str):\n                result.append(item.strip())\n            elif isinstance(item,\
          \ dict):\n                # 尝试提取常见文本字段\n                text = item.get('value')\
          \ or item.get('text') or item.get('content') or item.get('topic') or item.get('decision')\n\
          \                if text and isinstance(text, str):\n                  \
          \  result.append(text.strip())\n                else:\n                \
          \    # 如果找不到文本字段，尝试将整个字典转为可读字符串\n                    if 'value' in item:\n\
          \                        result.append(str(item['value']).strip())\n   \
          \                 elif 'content' in item:\n                        result.append(str(item['content']).strip())\n\
          \                    else:\n                        parts = []\n       \
          \                 for k, v in item.items():\n                          \
          \  if isinstance(v, str):\n                                parts.append(f\"\
          {k}: {v}\")\n                            elif isinstance(v, list):\n   \
          \                             parts.append(f\"{k}: {', '.join(str(i) for\
          \ i in v)}\")\n                            else:\n                     \
          \           parts.append(f\"{k}: {v}\")\n                        result.append('；'.join(parts))\n\
          \            else:\n                result.append(str(item).strip())\n \
          \       return [r for r in result if r]\n\n    # 将决策对象转换为纯文本字符串\n    def\
          \ convert_decision_to_text(dec):\n        if isinstance(dec, dict):\n  \
          \          # 优先提取主体内容\n            main_text = dec.get('decision_items')\
          \ or dec.get('content') or dec.get('decision') or dec.get('task') or ''\n\
          \            # 提取补充说明\n            supplement = dec.get('execution_boundaries')\
          \ or dec.get('supplement') or dec.get('details') or ''\n            if main_text:\n\
          \                if supplement:\n                    return f\"{main_text}（{supplement}）\"\
          \n                else:\n                    return main_text\n        \
          \    else:\n                # 降级：将字典转成可读字符串，但去掉空值字段\n                parts\
          \ = []\n                for k, v in dec.items():\n                    if\
          \ v:\n                        parts.append(f\"{k}: {v}\")\n            \
          \    return '；'.join(parts) if parts else str(dec)\n        else:\n    \
          \        return str(dec)\n\n    # 处理 discussions 和 decisions\n    discussions\
          \ = extract_text_list(discussions_raw)\n    decisions = [convert_decision_to_text(d)\
          \ for d in decisions_raw]   # 先转换再过滤空\n    decisions = [d for d in decisions\
          \ if d]  # 过滤空字符串\n\n    # 处理待办事项\n    action_items = []\n    for item in\
          \ action_items_raw:\n        if isinstance(item, dict):\n            task\
          \ = item.get('task') or item.get('content') or item.get('description') or\
          \ ''\n            assignee = item.get('assignee') if item.get('assignee')\
          \ is not None else None\n            due = item.get('due') if item.get('due')\
          \ is not None else None\n            details = item.get('details') if item.get('details')\
          \ is not None else None\n            if not task:\n                task\
          \ = ' '.join(f\"{k}:{v}\" for k, v in item.items() if v)\n            action_items.append({\n\
          \                \"task\": task.strip() if task else \"\",\n           \
          \     \"assignee\": assignee,\n                \"due\": due,\n         \
          \       \"details\": details\n            })\n        elif isinstance(item,\
          \ str):\n            action_items.append({\n                \"task\": item.strip(),\n\
          \                \"assignee\": None,\n                \"due\": None,\n \
          \               \"details\": None\n            })\n        else:\n     \
          \       action_items.append({\n                \"task\": str(item),\n  \
          \              \"assignee\": None,\n                \"due\": None,\n   \
          \             \"details\": None\n            })\n\n    # 构建输出文本\n    lines\
          \ = []\n    lines.append(f\"## 会议纪要\")\n    lines.append(f\"**会议ID**：{meeting_id}\\\
          n\")\n\n    lines.append(\"### 讨论点\")\n    for d in discussions:\n     \
          \   lines.append(f\"- {d}\")\n    lines.append(\"\")\n\n    lines.append(\"\
          ### 决策\")\n    for d in decisions:\n        lines.append(f\"- {d}\")\n \
          \   lines.append(\"\")\n\n    lines.append(\"### 待办事项\")\n    for item in\
          \ action_items:\n        task = item['task']\n        assignee = item['assignee']\
          \ if item['assignee'] else \"未指定\"\n        due = item['due'] if item['due']\
          \ else \"未指定\"\n        details = item['details'] if item['details'] else\
          \ \"\"\n        line = f\"- **任务**：{task}  **负责人**：{assignee}  **截止时间**：{due}\"\
          \n        if details:\n            line += f\"  **细节**：{details}\"\n   \
          \     if not item['assignee'] or not item['due']:\n            line += \"\
          \ **缺少必要信息**\"\n        lines.append(line)\n\n    final_text = \"\\n\".join(lines)\n\
          \    return {\"final_output\": final_text}"
        code_language: python3
